<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>부산딥클린 올인원 홈케어 | 부산·경남 4대 홈케어 전문</title>
  <meta name="description" content="부산·김해·양산·창원·밀양·울산 경남 전지역 프리미엄 줄눈, 블랙스텐 방충망, 일본 아크바리아 700 타일·욕실 코팅, 항균 바이오 실리콘 정석 시공" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <style>
    :root {
      --bg-canvas: #FAFAF9;
      --bg-card: #FFFFFF;
      --bg-subtle: #F5F5F4;
      --border-light: #E7E5E4;
      --border-mid: #D6D3D1;
      --text-primary: #111827;
      --text-secondary: #44403C;
      --text-muted: #78716C;

      --emerald: #047857;
      --emerald-light: #ECFDF5;
      --emerald-border: #A7F3D0;

      --gold: #B45309;
      --gold-light: #FFFBEB;
      --gold-border: #FDE68A;

      --blue: #1D4ED8;
      --blue-light: #EFF6FF;
      --blue-border: #BFDBFE;

      --purple: #6D28D9;
      --purple-light: #F5F3FF;
      --purple-border: #DDD6FE;

      --charcoal: #1F2937;
      --charcoal-light: #F3F4F6;

      --shadow-sm: 0 2px 8px rgba(17, 24, 39, 0.04);
      --shadow-md: 0 6px 20px rgba(17, 24, 39, 0.06);
      --shadow-lg: 0 12px 32px rgba(17, 24, 39, 0.12);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: #EFECE8;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 120px;
      line-height: 1.5;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.05);
      overflow-x: hidden;
    }

    button, input, textarea, select {
      font-family: inherit;
    }

    /* 1. 초미니멀 상단 헤더 */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(250, 250, 249, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-light);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .brand-region {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: -0.01em;
    }

    .admin-trigger-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-mid);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .admin-trigger-btn:active {
      transform: scale(0.97);
      background: var(--bg-subtle);
    }

    .container {
      padding: 0 18px;
    }

    /* 2. 박스 없는 미니멀 히어로 + 2x2 정품 스펙 라벨 그리드 */
    .hero-section {
      padding: 28px 18px 20px;
      text-align: left;
    }

    .hero-eyebrow {
      font-size: 13px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: -0.01em;
      margin-bottom: 10px;
    }

    .hero-title {
      font-size: 27px;
      font-weight: 800;
      line-height: 1.32;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    .hero-title .accent {
      color: var(--emerald);
    }

    .hero-subtitle {
      font-size: 14.5px;
      font-weight: 500;
      color: #57534E;
      line-height: 1.5;
      letter-spacing: -0.01em;
      margin-bottom: 22px;
    }

    .spec-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
    }

    .spec-item {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 12px 13px;
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, border-color 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .spec-item:active {
      transform: scale(0.98);
    }

    .spec-top {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .spec-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-emerald { background: var(--emerald); }
    .dot-gold { background: var(--gold); }
    .dot-blue { background: var(--blue); }
    .dot-charcoal { background: var(--charcoal); }

    .spec-value {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    /* 3. SNS 3열 입체 뱃지 */
    .sns-section {
      padding: 4px 18px 24px;
    }

    .sns-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .sns-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 11px 8px;
      text-decoration: none;
      color: var(--text-primary);
      font-size: 12.5px;
      font-weight: 700;
      box-shadow: 0 3px 0 #E7E5E4, var(--shadow-sm);
      transition: transform 0.12s ease;
    }

    .sns-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #E7E5E4;
    }

    .sns-badge-icon {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .sns-naver { background: #03C75A; }
    .sns-youtube { background: #FF0000; }
    .sns-insta {
      background: linear-gradient(135deg, #F58529 0%, #DD2A7B 55%, #8134AF 100%);
    }

    /* 섹션 공통 헤더 */
    .section-block {
      padding: 22px 18px;
      border-top: 1px solid var(--border-light);
    }

    .step-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--emerald);
      background: var(--emerald-light);
      border: 1px solid var(--emerald-border);
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .section-title {
      font-size: 19px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .section-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    /* 4. STEP 1: 4대 핵심 시공 2x2 동일 비율 4분할 실사진 카드 */
    .service-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px;
    }

    .service-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-light);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.16s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .service-card.selected {
      border-color: var(--emerald);
      box-shadow: 0 4px 14px rgba(4, 120, 87, 0.14);
    }

    .service-card.active-tab {
      outline: 2px solid rgba(4, 120, 87, 0.25);
    }

    .service-img-box {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #E7E5E4;
      position: relative;
      overflow: hidden;
    }

    .service-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .service-check-pill {
      position: absolute;
      top: 9px;
      right: 9px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      border: 1.5px solid var(--border-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      color: transparent;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      z-index: 2;
    }

    .service-card.selected .service-check-pill {
      background: var(--emerald);
      border-color: var(--emerald);
      color: #FFFFFF;
    }

    .service-card-body {
      padding: 11px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      justify-content: center;
    }

    .service-num {
      font-size: 11px;
      font-weight: 800;
      color: var(--gold);
    }

    .service-card-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .service-card-sub {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 5. STEP 2: 스마트 탭 전환형 자재·공간 세부 선택기 */
    .tab-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }

    .tab-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 10px 4px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      position: relative;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: var(--text-primary);
      border-color: var(--text-primary);
      color: #FFFFFF;
    }

    .tab-btn .tab-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--emerald);
      margin-left: 3px;
      vertical-align: middle;
    }

    .detail-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    .panel-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--bg-subtle);
    }

    .panel-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .panel-sub-pill {
      font-size: 11px;
      font-weight: 700;
      color: var(--emerald);
      background: var(--emerald-light);
      border: 1px solid var(--emerald-border);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .service-notice-banner {
      background: var(--gold-light);
      border: 1px solid var(--gold-border);
      color: #92400E;
      font-size: 12.5px;
      font-weight: 700;
      padding: 9px 12px;
      border-radius: 10px;
      margin-bottom: 14px;
    }

    .sub-label {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-secondary);
      margin-bottom: 8px;
      display
